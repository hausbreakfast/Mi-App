// --- FUNCIÓN HELPER: GENERA LA OPCIÓN DE PERSONALIZACIÓN ---
function obtenerOpcionRemoverIngredientes(descripcion) {
  if (!descripcion) return null;
  
  const listaLimpia = descripcion
    .replace(/\b(y|o|con|servido con|decorado con|en|salsa de su selección|salsa de preferencia|seleccione tamaño|incluye combo)\b/gi, ',')
    .split(',')
    .map(ing => ing.trim())
    .filter(ing => ing.length > 2 && !ing.toLowerCase().includes('selección') && !ing.toLowerCase().includes('preferencia'));

  const ingredientesUnicos = [...new Set(listaLimpia)];

  const opcionesModificacion = [
    { nombre: 'Servir tal como viene (Sin cambios)', precio: 0, esDefault: true },
    ...ingredientesUnicos.map(ing => ({
      nombre: `Sin ${ing.charAt(0).toUpperCase() + ing.slice(1)}`,
      precio: 0,
      esDefault: false
    }))
  ];

  return {
    nombre: 'Personalizar / Remover Ingredientes',
    tipo: 'checkbox',
    items: opcionesModificacion
  };
}

// --- COMPONENTE PRINCIPAL ---
function MenuApp() {
  const [categoriaActiva, setCategoriaActiva] = useState('Especialidades');
  const [carrito, setCarrito] = useState([]);
  const [productoSeleccionado, setProductoSeleccionado] = useState(null);
  const [opcionesElegidas, setOpcionesElegidas] = useState({});

  const productosFiltrados = MENU_DATA.filter(p => p.categoria === categoriaActiva);

  const abrirModal = (producto) => {
    const opcionRemover = obtenerOpcionRemoverIngredientes(producto.descripcion);
    let opcionesCompletas = producto.opciones ? [...producto.opciones] : [];

    if (opcionRemover) {
      opcionesCompletas.unshift(opcionRemover);
    }

    const estadoInicial = {};
    if (opcionRemover) {
      estadoInicial[opcionRemover.nombre] = [opcionRemover.items[0]];
    }

    setProductoSeleccionado({
      ...producto,
      opcionesCompletas
    });
    setOpcionesElegidas(estadoInicial);
  };

  const cerrarModal = () => {
    setProductoSeleccionado(null);
    setOpcionesElegidas({});
  };

  const seleccionarOpcionRadio = (grupo, item) => {
    setOpcionesElegidas({ ...opcionesElegidas, [grupo]: item });
  };

  const toggleOpcionCheckbox = (grupo, item) => {
    const seleccionados = opcionesElegidas[grupo] || [];
    const esDefaultOption = item.esDefault;

    let nuevos = [];

    if (esDefaultOption) {
      nuevos = [item];
    } else {
      const sinDefault = seleccionados.filter(i => !i.esDefault);
      const existe = sinDefault.some(i => i.nombre === item.nombre);
      
      if (existe) {
        nuevos = sinDefault.filter(i => i.nombre !== item.nombre);
      } else {
        nuevos = [...sinDefault, item];
      }

      if (nuevos.length === 0) {
        const opcionDefault = productoSeleccionado.opcionesCompletas
          .find(g => g.nombre === grupo)?.items
          .find(i => i.esDefault);
        if (opcionDefault) nuevos = [opcionDefault];
      }
    }

    setOpcionesElegidas({ ...opcionesElegidas, [grupo]: nuevos });
  };

  const calcularPrecioProductoModal = () => {
    if (!productoSeleccionado) return 0;
    let extra = 0;
    Object.values(opcionesElegidas).forEach(val => {
      if (Array.isArray(val)) {
        val.forEach(i => extra += i.precio);
      } else if (val && val.precio) {
        extra += val.precio;
      }
    });
    return productoSeleccionado.precio + extra;
  };

  const agregarAlCarritoDesdeModal = () => {
    const itemFinal = {
      ...productoSeleccionado,
      precioCalculado: calcularPrecioProductoModal(),
      opcionesDetalle: opcionesElegidas,
      cartId: Date.now()
    };
    setCarrito([...carrito, itemFinal]);
    cerrarModal();
  };

  const totalArticulos = carrito.length;
  const totalPrecio = carrito.reduce((sum, item) => sum + (item.precioCalculado || item.precio), 0).toFixed(2);

  return (
    <div className="min-h-screen bg-neutral-950 text-neutral-100 font-sans pb-24">
      {/* Encabezado */}
      <header className="sticky top-0 z-10 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800 px-4 py-4 flex justify-between items-center">
        <div>
          <h1 className="text-2xl font-black tracking-wider text-amber-500">HAU'S</h1>
          <p className="text-xs text-neutral-400">Breakfast & Brunch • Tel. 939-256-5036</p>
        </div>
        <div className="bg-neutral-800 px-3 py-1 rounded-full text-xs font-medium text-emerald-400 border border-emerald-500/20">
          ● Ordena y Recoge
        </div>
      </header>

      {/* Navegación por Categorías */}
      <nav className="sticky top-[69px] z-10 bg-neutral-950/90 backdrop-blur-md px-4 py-3 border-b border-neutral-800 flex gap-2 overflow-x-auto no-scrollbar">
        {CATEGORIAS.map((cat) => (
          <button
            key={cat}
            onClick={() => setCategoriaActiva(cat)}
            className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${
              categoriaActiva === cat
                ? 'bg-amber-500 text-neutral-950 shadow-lg shadow-amber-500/20'
                : 'bg-neutral-900 text-neutral-400 hover:text-neutral-200'
            }`}
          >
            {cat}
          </button>
        ))}
      </nav>

      {/* Lista de Productos */}
      <main className="px-4 py-6 max-w-md mx-auto space-y-4">
        {productosFiltrados.length === 0 ? (
          <p className="text-center text-neutral-500 text-sm py-8">No hay productos en esta categoría.</p>
        ) : (
          productosFiltrados.map((item) => (
            <div 
              key={item.id}
              onClick={() => abrirModal(item)}
              className="bg-neutral-900 border border-neutral-800/80 rounded-2xl p-3 flex gap-3 shadow-sm hover:border-neutral-700 transition-all cursor-pointer"
            >
              <img 
                src={item.imagen} 
                alt={item.nombre} 
                className="w-24 h-24 object-cover rounded-xl flex-shrink-0 bg-neutral-800"
              />
              <div className="flex flex-col justify-between flex-grow">
                <div>
                  <h3 className="font-bold text-neutral-100 leading-tight">{item.nombre}</h3>
                  <p className="text-xs text-neutral-400 mt-1 line-clamp-2">{item.descripcion}</p>
                </div>
                <div className="flex justify-between items-center mt-2">
                  <span className="font-extrabold text-amber-500">${item.precio.toFixed(2)}</span>
                  <button className="bg-neutral-800 hover:bg-neutral-700 text-amber-500 font-bold px-3 py-1 rounded-lg transition-colors text-sm">
                    +
                  </button>
                </div>
              </div>
            </div>
          ))
        )}
      </main>

      {/* Modal de Personalización */}
      {productoSeleccionado && (
        <div className="fixed inset-0 z-30 bg-black/70 backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
          <div className="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-start mb-4">
              <div>
                <h2 className="text-xl font-bold text-amber-500">{productoSeleccionado.nombre}</h2>
                <p className="text-xs text-neutral-400 mt-0.5">{productoSeleccionado.descripcion}</p>
              </div>
              <button onClick={cerrarModal} className="text-neutral-400 hover:text-white font-bold text-lg px-2">✕</button>
            </div>

            {/* Opciones */}
            {productoSeleccionado.opcionesCompletas?.map((grupo, idx) => (
              <div key={idx} className="mb-5 border-t border-neutral-800 pt-3">
                <h4 className="text-sm font-semibold text-neutral-200 mb-2">{grupo.nombre}</h4>
                <div className="space-y-2">
                  {grupo.items.map((opt, oIdx) => {
                    const isRadio = grupo.tipo === 'radio';
                    const isSelected = isRadio 
                      ? opcionesElegidas[grupo.nombre]?.nombre === opt.nombre
                      : (opcionesElegidas[grupo.nombre] || []).some(i => i.nombre === opt.nombre);

                    return (
                      <div 
                        key={oIdx}
                        onClick={() => isRadio ? seleccionarOpcionRadio(grupo.nombre, opt) : toggleOpcionCheckbox(grupo.nombre, opt)}
                        className={`flex justify-between items-center p-3 rounded-xl border text-sm cursor-pointer transition-all ${
                          isSelected ? 'bg-amber-500/10 border-amber-500 text-amber-400' : 'bg-neutral-800/50 border-neutral-800 text-neutral-300'
                        }`}
                      >
                        <span className={opt.esDefault ? 'font-medium italic' : ''}>{opt.nombre}</span>
                        <span className="text-xs font-semibold">
                          {opt.precio > 0 ? `+$${opt.precio.toFixed(2)}` : ''}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}

            <button 
              onClick={agregarAlCarritoDesdeModal}
              className="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-3.5 px-5 rounded-2xl shadow-xl flex justify-between items-center"
            >
              <span>Agregar al Pedido</span>
              <span>${calcularPrecioProductoModal().toFixed(2)}</span>
            </button>
          </div>
        </div>
      )}

      {/* Botón Flotante del Carrito */}
      {totalArticulos > 0 && (
        <div className="fixed bottom-4 left-4 right-4 max-w-md mx-auto z-20">
          <button className="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold py-3.5 px-5 rounded-2xl shadow-xl flex justify-between items-center transition-all">
            <div className="flex items-center gap-2">
              <span className="bg-neutral-950 text-amber-500 text-xs px-2 py-0.5 rounded-full">
                {totalArticulos}
              </span>
              <span>Ver mi Orden</span>
            </div>
            <span>${totalPrecio}</span>
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MenuApp />);
  </script>
</body>
</html>
